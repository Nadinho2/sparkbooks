<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Open Ledger Pages -->
  <g transform="translate(10, 18)">
    <!-- Left page -->
    <path d="M22 6 C16 4, 6 6, 2 8 L2 29 C6 27, 16 25, 22 27 Z" fill="#F8FAFC" fill-opacity="0.95" />
    <!-- Right page -->
    <path d="M22 6 C28 4, 38 6, 42 8 L42 29 C38 27, 28 25, 22 27 Z" fill="#E2E8F0" fill-opacity="0.95" />
    <!-- Book spine / center fold -->
    <path d="M22 6 L22 27" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />
    <!-- Ledger ruled lines on left page -->
    <line x1="6" y1="13" x2="18" y2="11.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="6" y1="18" x2="18" y2="16.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="6" y1="23" x2="18" y2="21.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
    <!-- Ledger ruled lines on right page -->
    <line x1="26" y1="11.5" x2="38" y2="13" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="26" y1="16.5" x2="38" y2="18" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="26" y1="21.5" x2="38" y2="23" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- Glowing AI Spark rising from the ledger center -->
  <path d="M32 9 C32 14, 35 17, 40 17 C35 17, 32 20, 32 25 C32 20, 29 17, 24 17 C29 17, 32 14, 32 9 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
  
  <!-- Secondary micro-spark for sparkle balance -->
  <circle cx="43" cy="11" r="1.5" fill="#FBBF24" />
</svg>
